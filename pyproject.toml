[project]
name = "lscan"
version = "0.1.0"
description = "PVP threat profiling for EVE Online - server-rendered Django monolith"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.11",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "redis>=8.0.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.1,<6",
    "pytest>=8.3",
    "pytest-django>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lscan", "src/intel"]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main"]
mypy_path = "src:tests"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "environ.*"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "lscan.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "lscan.settings"
pythonpath = ["src", "tests"]
testpaths = ["tests"]
